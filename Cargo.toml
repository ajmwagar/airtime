[package]
name    = "airtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Personal AI radio station platform — multi-station Icecast2 streaming with LLM-scripted DJ segments."
license = "MIT"

[dependencies]
tokio          = { version = "1.40", features = ["full"] }
reqwest        = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
toml           = "0.8"
anyhow         = "1.0"
thiserror      = "1.0"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait    = "0.1"
chrono         = { version = "0.4", features = ["serde"] }
lofty          = "0.21"
quick-xml      = { version = "0.36", features = ["serialize"] }
futures        = "0.3"
walkdir        = "2.5"
rand           = "0.8"
url            = "2.5"
percent-encoding = "2.3"
base64         = "0.22"

[dev-dependencies]
wiremock       = "0.6"
tempfile       = "3.10"
pretty_assertions = "1.4"
tokio          = { version = "1.40", features = ["full", "test-util", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
