[icecast]
host     = "localhost"
port     = 8000
password = "hackme"
user     = "source"

[ollama]
base_url = "http://localhost:11434"
model    = "llama3.1:8b"

[claude]
model    = "claude-sonnet-4-20250514"
# API key via ANTHROPIC_API_KEY env var

# Optional: route some skills through OpenRouter for access to non-Claude,
# non-local models (Gemini, Llama, Mistral, etc.) under a single API key.
# Enable by uncommenting and setting `llm_backend = "openrouter"` on the
# skills you want to route there. API key via OPENROUTER_API_KEY env var.
[openrouter]
model = "google/gemini-flash-1.5"

[kokoro]
model_path  = "./models/kokoro-v1.0.onnx"
voices_path = "./models/voices.bin"
sample_rate = 24000
binary  = "./docker/kokoro"   # local kokoro shim

[library]
path          = "/music"
formats       = ["flac", "wav", "aiff"]
scan_on_start = true

[feeds]
weather_lat = 47.6062
weather_lon = -122.3321

[feeds.traffic]
provider = "tomtom"
# API key via TOMTOM_API_KEY env var

[audio]
temp_dir        = "/tmp/airtime"
loudness_target = -14.0
true_peak       = -1.0
