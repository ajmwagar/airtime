[host]
name         = "Donna Wavelength"
callsign     = "KFLT"
era          = "1960s"
genre        = ["jazz", "soul", "bossa nova"]
voice_model  = "af_bella"
tone_prompt  = """
Warm, slightly sardonic late-night jazz host.
1960s AM radio energy. Knows every session musician
by name. Occasionally wistful. Never hurried.
"""
# Persona-wide default backend — any enabled skill without its own
# `[host.skill_config.X].llm_backend` inherits this. Unset → "ollama".
default_llm_backend = "openrouter"

# Imperial units — Donna's a Seattle host so she'll say "fifty-three
# degrees Fahrenheit, wind eight miles per hour" instead of metric.
# Set to "metric" for everywhere else.
units = "imperial"

# Music cadence outside any daypart — one talk break every N tracks.
# Day-parts below can override per-window.
tracks_per_break = 3

# Day-parted programming. First matching window wins (so keep them
# non-overlapping). `hours = "22-04"` wraps midnight; "06-09" is
# half-open: 6, 7, 8 (not 9). `extra_tone` is appended to the
# system prompt for that window only — Donna sounds different at
# 2 AM than at noon.
[[host.dayparts]]
name = "late_night"
hours = "22-04"
tracks_per_break = 5
extra_tone = """
Late-night drive vibe. Hushed, intimate, for the night-shift cats
and the lone commuters. Talk less, let the records breathe.
"""

[[host.dayparts]]
name = "afternoon"
hours = "13-17"
tracks_per_break = 3
extra_tone = """
Sunny-afternoon energy. A little more buoyant, a little more
chatty. The lunch crowd is back at their desks; keep them company.
"""

[host.skills]
track_intro  = true
track_outro  = true
top_of_hour  = true
weather      = true
traffic      = false
station_id   = true
fake_ad      = false
caller       = false

[host.skill_config.top_of_hour]
max_words    = 80
llm_backend  = "openrouter"
news_sources = ["https://feeds.npr.org/1001/rss.xml"]

[host.skill_config.weather]
max_words    = 40
llm_backend  = "openrouter"

[host.skill_config.track_intro]
max_words    = 40
llm_backend  = "openrouter"

[host.skill_config.track_outro]
max_words    = 30
llm_backend  = "openrouter"

[host.skill_config.station_id]
max_words    = 20
llm_backend  = "openrouter"

[host.audio]
eq_profile      = "warm_analog"
room_tone       = true
loudness_target = -14.0

[stream]
mount  = "/donna"
# Wire format choices: "mp3" (default-256k, universal), "opus" (default
# 160k, modern + efficient), "flac" (lossless, narrower listener support).
# Override the bitrate per-format with `bitrate = N` (kbps).
format = "mp3"
bitrate = 256
